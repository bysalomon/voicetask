name: VoiceTask CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: voicetask-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check all Supabase Edge Functions
        run: |
          for file in supabase/functions/*/index.ts; do
            deno check "$file"
          done
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm install --no-audit --no-fund
      - name: Clean up stale isolated Supabase processes
        run: supabase stop --no-backup || true
      - name: Start isolated Supabase and apply all migrations
        run: supabase start
      - name: Check SQL tests
        run: supabase test db
      - name: Test real RLS, concurrency, account protection and money guards
        run: |
          supabase status -o env > /tmp/voicetask-status.env
          set -a
          source /tmp/voicetask-status.env
          set +a
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" npm run test:integration
      - name: Seed disposable browser member and task
        run: |
          supabase status -o env > /tmp/voicetask-e2e.env
          set -a
          source /tmp/voicetask-e2e.env
          set +a
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" node tests/integration/seed-e2e.mjs
      - name: Start local Edge Functions (nonproduction)
        run: |
          echo 'ALLOWED_ORIGIN=http://127.0.0.1:4173' > supabase/.env.e2e
          nohup supabase functions serve --no-verify-jwt --env-file supabase/.env.e2e > /tmp/voicetask-functions.log 2>&1 &
          sleep 8
      - name: Install Chromium and test real member recording journey
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e -- --project=chromium --grep @live
        env:
          CI: 'true'
      - if: always()
        run: supabase stop --no-backup
