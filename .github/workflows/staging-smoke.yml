name: VoiceTask managed staging smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/staging-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  managed-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert live invitation endpoint CORS and input validation
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://mlypusfsxafsdnnzquek.supabase.co/functions/v1/accept-invite'
          origin='https://voicetask-staging.vercel.app'
          headers="$(mktemp)"
          response="$(mktemp)"
          code="$(curl --silent --show-error --max-time 30 \
            --dump-header "$headers" --output "$response" --write-out '%{http_code}' \
            -X OPTIONS "$endpoint" \
            -H "Origin: $origin" -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: apikey,authorization,content-type')"
          echo "Live OPTIONS status: $code"
          test "$code" = '204'
          grep -qiF "access-control-allow-origin: $origin" "$headers"
          code="$(curl --silent --show-error --max-time 30 \
            --dump-header "$headers" --output "$response" --write-out '%{http_code}' \
            -X POST "$endpoint" -H "Origin: $origin" \
            -H 'Content-Type: application/json' \
            --data '{"pin":"invalid","token":"invalid"}')"
          echo "Live invalid-registration POST status: $code"
          test "$code" = '400'
          grep -qiF "access-control-allow-origin: $origin" "$headers"
          grep -q 'Invalid registration details' "$response"
          echo 'PASS: Live staging invitation endpoint accepts configured CORS origin and rejects invalid registration.'
